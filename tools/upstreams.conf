# Pinned upstreams.
#
# min  = tested floor; the build fails if the resolved version is lower.
# lock = exact ref that was built; written by --update and used by
#        normal runs so two builds of the same lock are identical.
# ref  = branch or tag to follow when --update resolves a new lock.

[virt-manager]
url = https://github.com/virt-manager/virt-manager
file = https://github.com/virt-manager/virt-manager/archive/refs/tags/v5.1.0.tar.gz
min = 5.1.0
lock = v5.1.0
lock_commit = eb4898b19e550af19daea49ae5ed15d2d70a2fc4

[qemu]
url = https://download.qemu.org
min = 11.1.3
lock = 11.1.3
lock_file = qemu-11.1.3.tar.xz
ref = stable
# OVMF is built from roms/edk2 in this tarball; see patches/ovmf/.

[vmvga]
url = https://github.com/qemus/qemu-vmvga.git
min = v1.03
lock = d5bb723f0f152440daf4e9dbc8c7568f6d40be4c
ref = master

[dxvk-native]
url = https://github.com/doitsujin/dxvk.git
min = 3.1.1
lock = v3.1.1
lock_commit = b1a1c99ab52b687cf950d62c88bc2fa316b41663
ref = latest

[virglrenderer]
url = https://gitlab.freedesktop.org/virgl/virglrenderer.git
min = 1.3.0
lock = 18dbf1874e002d56982aa6679b2cb80d71a21cd6
ref = main
